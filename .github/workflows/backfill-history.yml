name: Backfill historical FOMC scores 2000-2005

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-fomc-dashboard-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill official statements and score meetings by year
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for year in 2000 2001 2002 2003 2004 2005; do
            echo "Backfilling FOMC statements for $year"
            node src/backfill-history.mjs "$year"
            if git diff --quiet; then
              echo "No source data changes for $year."
              continue
            fi
            git add data/
            git commit -m "Backfill FOMC scores for $year"
            git push origin main
          done
