name: Update latest FOMC score

on:
  schedule:
    # 02:00 Taipei time on Thursday (18:00 UTC on Wednesday)
    - cron: "0 18 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-fomc-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest statement and score only if needed
        run: npm run update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Refresh 2-year Treasury yield source
        run: npm run update:yields

      - name: Build dashboard data
        run: npm run build:dashboard

      - name: Commit updated source data and dashboard
        run: |
          if git diff --quiet; then
            echo "No FOMC or DGS2 data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dashboard.json is generated during the Pages deployment and is intentionally ignored.
          # Commit only the source data so Git does not reject the ignored build output.
          git add data/
          git commit -m "Refresh FOMC dashboard data"
          git push
